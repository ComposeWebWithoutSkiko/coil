name: Publish web-canvas
on:
    push:
        tags:
            - '*-webcanvas.*'
permissions:
    contents: read
jobs:
    publish:
        name: Publish
        runs-on: ubuntu-latest
        timeout-minutes: 60
        steps:
            - uses: actions/checkout@v7
            - uses: actions/setup-java@v6
              with:
                  distribution: 'zulu'
                  java-version: 21

            - name: Publish the wasmJs artifacts
              env:
                  VERSION: ${{ github.ref_name }}
                  COMPOSE_REPO_URL: https://repo.redlance.org/public
                  COMPOSE_REPO_USERNAME: ${{ secrets.REDLANCE_MAVEN_USERNAME }}
                  COMPOSE_REPO_KEY: ${{ secrets.REDLANCE_MAVEN_TOKEN }}
              run: >
                  ./gradlew --no-configuration-cache
                  :coil-core:publishWasmJsPublicationToComposeRepoRepository
                  :coil-compose-core:publishWasmJsPublicationToComposeRepoRepository
                  :coil-compose:publishWasmJsPublicationToComposeRepoRepository
                  :coil:publishWasmJsPublicationToComposeRepoRepository
                  :coil-network-core:publishWasmJsPublicationToComposeRepoRepository
                  :coil-network-ktor3:publishWasmJsPublicationToComposeRepoRepository
                  -PVERSION_NAME="$VERSION"
                  -PRELEASE_SIGNING_ENABLED=false
                  -x dokkaGenerate
